[package]
name = "mc-rust-exec"
description = "Madara RustExec engine — native Rust transaction executor"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# Starknet types - using explicit version matching workspace
starknet-crypto = { workspace = true }
starknet-types-core = { workspace = true, default-features = false, features = [
  "hash",
  "serde",
] }

# Hashing
keccak = "0.1"
sha3.workspace = true

# Math - for u256 arithmetic
num-bigint.workspace = true
num-traits.workspace = true

# Collections
indexmap = { version = "2.0", features = ["serde"] }
once_cell = "1.19"

# Logging
tracing = { workspace = true, default-features = false }

# Error handling
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror.workspace = true

# Blockifier integration
blockifier = { workspace = true }
mp-convert = { workspace = true }
starknet_api = { workspace = true }

[dev-dependencies]
rstest.workspace = true
proptest = { workspace = true }
mc-rust-exec = { path = ".", features = ["testing"] }
m-cairo-test-contracts.workspace = true
starknet-core.workspace = true

[build-dependencies]
serde_json.workspace = true

[features]
default = []
testing = []
