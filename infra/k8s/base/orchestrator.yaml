apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: madara-orchestrator
          image: ghcr.io/madara-alliance/orchestrator:nightly
          imagePullPolicy: Always
          args:
            - run
            - --prover
            - sharp
            - --aws
            - --settle-on-ethereum
            - --aws-s3
            - --aws-sqs
            - --aws-sns
            - --da-on-ethereum
            - --layer
            - l2
            - --mongodb
          envFrom:
            - configMapRef:
                name: madara-orchestrator-config
            - secretRef:
                name: madara-orchestrator-secrets
          ports:
            - containerPort: 3000
              name: rpc
              protocol: TCP
          volumeMounts:
            - name: sharp-mtls
              mountPath: /var/run/orchestrator-sharp
              readOnly: true
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: "4"
              memory: 8Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        - name: sharp-mtls
          secret:
            secretName: madara-orchestrator-secrets
            items:
              - key: MADARA_ORCHESTRATOR_SHARP_USER_CRT
                path: user.crt
              - key: MADARA_ORCHESTRATOR_SHARP_USER_KEY
                path: user.key
              - key: MADARA_ORCHESTRATOR_SHARP_SERVER_CRT
                path: server.crt
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
