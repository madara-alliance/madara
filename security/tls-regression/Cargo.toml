[package]
name = "emsign-tls-regression"
version = "0.1.0"
edition = "2021"
publish = false

# Keep this inexpensive test independent of Cairo, LLVM, and application builds.
[workspace]

[dependencies]
rcgen = "=0.13.2"
rootcerts = { package = "webpki-root-certs", version = "=1.0.10" }
roots1 = { package = "webpki-roots", version = "=1.0.10" }
rustls-pemfile = "2.2"
rustls-pki-types = "1.12"
time = "=0.3.44"
webpki103 = { package = "rustls-webpki", version = "=0.103.16", features = [
  "ring",
] }

# Exercise the same AWS default-client selection, including its legacy compatibility feature.
aws-smithy-runtime = { version = "=1.9.5", features = [
  "client",
  "default-https-client",
  "tls-rustls",
  "rt-tokio",
] }
aws-smithy-runtime-api = { version = "=1.9.3", features = ["client"] }
aws-smithy-types = "=1.3.5"
jsonrpsee-http-client = { version = "=0.22.5", default-features = false }
jsonrpsee-ws-client = { version = "=0.22.5", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "time"] }
