[package]
name = "emsign-tls-regression"
version = "0.1.0"
edition = "2021"
publish = false

# Keep this inexpensive test independent of Cairo, LLVM, and application builds.
[workspace]

[dependencies]
webpki101 = { package = "rustls-webpki", path = "../vendor/rustls-webpki-0.101.7" }
webpki102 = { package = "rustls-webpki", path = "../vendor/rustls-webpki-0.102.8", features = ["ring"] }
webpki103 = { package = "rustls-webpki", version = "=0.103.16", features = ["ring"] }
roots025 = { package = "webpki-roots", path = "../vendor/webpki-roots-0.25.4" }
roots1 = { package = "webpki-roots", version = "=1.0.10" }
rootcerts = { package = "webpki-root-certs", version = "=1.0.10" }
rustls-pemfile = "2.2"
rustls-pki-types = "1.12"
rcgen = "=0.13.2"
time = "=0.3.44"
