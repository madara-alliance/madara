---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: Task - Test E2E

# This workflow runs end-to-end tests for the Madara System
# It builds all required binaries and runs the e2e test suite
on:
  workflow_dispatch:
  workflow_call: {}

permissions:
  contents: read

jobs:
  test-end-to-end:
    name: E2E (${{ matrix.merkle-mode }} Merkle)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - merkle-mode: sequential
            finalizer-mode: serial
            parallel-merkle: "false"
            root-workers: "1"
          - merkle-mode: parallel
            finalizer-mode: parallel_merkle
            parallel-merkle: "true"
            root-workers: "2"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Load env
        uses: ./.github/actions/load-env

      - name: Foundry setup
        uses: ./.github/actions/setup-foundry
        with:
          foundry-version: ${{ env.BUILD_FOUNDRY_VERSION }}

      - name: Pull Docker images
        run: |
          docker pull localstack/localstack@sha256:763947722c6c8d33d5fbf7e8d52b4bddec5be35274a0998fdc6176d733375314
          docker pull mongo:latest

      - name: Rust setup
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.BUILD_RUST_VERSION }}
          cache-key: workspace-dev-${{ runner.os }}-rust-${{ env.BUILD_RUST_VERSION }}

      - name: Cairo Native setup
        uses: ./.github/actions/setup-cairo-native

      - name: Setup Python Cairo (needed for orchestrator build)
        uses: ./.github/actions/setup-python-cairo

      - name: Build Madara
        run: CARGO_TARGET_DIR=target cargo build --locked --bin madara --release

      - name: Build Orchestrator
        run: CARGO_TARGET_DIR=target cargo build --locked --bin orchestrator --release

      - name: Build Bootstrapper V2
        run: CARGO_TARGET_DIR=target cargo build --locked --manifest-path bootstrapper-v2/Cargo.toml --bin bootstrapper-v2 --release

      - name: Download and extract Pathfinder binary
        run: |
          mkdir -p target/release/
          curl -L -o pathfinder.tar.gz https://github.com/karnotxyz/pathfinder/releases/download/v0.22.3-karnot.1/pathfinder-x86_64-unknown-linux-gnu.tar.gz
          tar -xf pathfinder.tar.gz -C target/release/
          rm pathfinder.tar.gz

      - name: Make binaries executable
        run: |
          chmod +x target/release/madara
          chmod +x target/release/bootstrapper-v2
          chmod +x target/release/pathfinder
          chmod +x target/release/orchestrator
          chmod +x test_utils/scripts/deploy_dummy_verifier.sh

      - name: Build E2E for tests
        run: cargo build --locked -p e2e

      - name: Run E2E test
        shell: bash
        env:
          AWS_REGION: us-east-1
          # Child Madara processes inherit these CLI environment settings, including during genesis setup.
          MADARA_PARALLEL_MERKLE_ENABLED: ${{ matrix.parallel-merkle }}
          MADARA_PARALLEL_MERKLE_ROOT_WORKERS: ${{ matrix.root-workers }}
          MADARA_PARALLEL_MERKLE_MAX_INFLIGHT: "10"
          MADARA_PARALLEL_MERKLE_FLUSH_INTERVAL: "3"
          MADARA_PARALLEL_MERKLE_COMPARE_SEQUENTIAL: "false"
        run: |
          RUST_LOG=info cargo test --locked \
          --package e2e test_bridge_deposit_and_withdraw \
          -- --test-threads=1 --nocapture 2>&1 | tee e2e-${{ matrix.merkle-mode }}.log
          grep -F "initialized_finalizer_runtime mode=${{ matrix.finalizer-mode }} " e2e-${{ matrix.merkle-mode }}.log

      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.merkle-mode }}-log
          path: e2e-${{ matrix.merkle-mode }}.log
          if-no-files-found: ignore
          retention-days: 7
