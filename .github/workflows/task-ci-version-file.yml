---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: Task - Version File Management

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      label:
        description: "Label used to trigger this workflow"
        required: true
        type: string
      version-file:
        description: "Path to the version file to update"
        required: true
        type: string
      container-image:
        description: "Container image that should have a tag matching the version file"
        required: false
        default: ""
        type: string
    outputs:
      update:
        description: "Whether or not the version file was updated"
        value: ${{ jobs.update-version-file.outputs.update }}
      version:
        description: "Current version from the version file after any update"
        value: ${{ jobs.update-version-file.outputs.version }}
      tag-exists:
        description: "Whether the matching container image tag already exists"
        value: ${{ jobs.update-version-file.outputs.tag-exists }}

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - run: echo "Checking Version File ('${{ inputs.label }}' label only)"

  update-version-file:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    if: contains(github.event.pull_request.labels.*.name, inputs.label)
    outputs:
      update: ${{ steps.check_bump.outputs.update }}
      version: ${{ steps.version.outputs.version }}
      tag-exists: ${{ steps.check_tag.outputs.tag-exists }}
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: recursive

      - uses: dcarbone/install-yq-action@v1
      - name: Check if PR already bumped
        id: check_bump
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if yq -e ".versions[] | select(.pr == ${PR_NUM})" ${{ inputs.version-file }} > /dev/null 2>&1; then
            echo "update=false" >> $GITHUB_OUTPUT
          else
            echo "update=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.check_bump.outputs.update == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Update Version File
        if: steps.check_bump.outputs.update == 'true'
        run: |
          ./scripts/update-version-file.sh "${{ github.event.pull_request.number }}" ${{ inputs.version-file }}

      - name: Read Current Version
        id: version
        run: |
          VERSION=$(yq -e ".current_version" ${{ inputs.version-file }})
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to the container registry
        if: inputs.container-image != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Container Tag
        if: inputs.container-image != ''
        id: check_tag
        run: |
          IMAGE="${{ inputs.container-image }}:${{ steps.version.outputs.version }}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "tag-exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag-exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push
        if: steps.check_bump.outputs.update == 'true'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git add ${{ inputs.version-file }}
            git commit -m "chore: bump ${{ inputs.version-file }}"
            git push origin ${{ github.head_ref || github.ref_name }}
          fi
