---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: Task - Build Cairo Artifacts

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      registry:
        description: Container registry domain
        required: false
        default: ghcr.io
        type: string
      should_run:
        required: false
        default: "true"
        type: string
      artifact-version:
        description: "Exact artifact version to tag"
        required: false
        default: ""
        type: string
    outputs:
      artifacts:
        description: Artifacts image tag
        value: ${{ jobs.build-artifacts.outputs.artifacts }}
      artifacts-pr:
        description: Artifacts image tag (with pr number)
        value: ${{ jobs.build-artifacts.outputs.artifacts-pr }}

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - run: echo "Building ${{ inputs.artifacts-pr }}"

  build-artifacts:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    if: inputs.should_run == 'true'
    env:
      BLACKSMITH_DOCKER_CACHE_KEY: ${{ github.repository }}-docker-artifacts
    outputs:
      artifacts: ${{ steps.tag.outputs.artifacts }}
      artifacts-pr: ${{ steps.tag.outputs.artifacts-pr }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Load env
        uses: ./.github/actions/load-env

      - name: Cairo Native setup
        uses: ./.github/actions/setup-cairo-native

      - name: Compile artifacts
        run: yes | make artifacts

      - name: Compress artifacts
        run: |
          tar \
            --exclude archive.docker \
            --exclude build.docker \
            --exclude cairo_artifacts \
            --exclude Cargo.toml \
            --exclude src \
            -czvf artifacts.tar.gz build-artifacts/

      - name: Tags
        id: tag
        run: |
          IMAGE="${{ inputs.registry }}/${{ github.repository_owner }}/artifacts"
          VERSION="${{ inputs.artifact-version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(yq -e ".current_version" .artifact-versions.yml)
            VERSION=$(($VERSION+1))
          fi
          ARTIFACTS="$IMAGE"
          ARTIFACTS_PR="$IMAGE:$VERSION"

          echo "artifacts=$ARTIFACTS" >> $GITHUB_OUTPUT
          echo "artifacts-pr=$ARTIFACTS_PR" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --file build-artifacts/archive.docker \
            --tag "${{ steps.tag.outputs.artifacts }}" \
            --tag "${{ steps.tag.outputs.artifacts-pr }}" \
            .
          docker save \
            --output "${{ runner.temp }}/artifacts.tar" \
            "${{ steps.tag.outputs.artifacts }}" \
            "${{ steps.tag.outputs.artifacts-pr }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: artifacts
          path: ${{ runner.temp }}/artifacts.tar
          retention-days: 3
