---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: Manual Docker Image Build

on:
  workflow_dispatch:
    inputs:
      build-madara:
        description: "Build Madara image"
        required: true
        type: boolean
        default: true
      skip-cargo-check:
        description: "Skip workspace cargo check before the image build (for validated retries)"
        required: true
        type: boolean
        default: false
      build-orchestrator:
        description: "Build Orchestrator image"
        required: true
        type: boolean
        default: true
      build-bootstrapper:
        description: "Build Bootstrapper V1 image (deprecated)"
        required: true
        type: boolean
        default: false
      build-bootstrapper-v2:
        description: "Build Bootstrapper V2 image"
        required: true
        type: boolean
        default: true

jobs:
  build-and-publish-madara:
    if: ${{ inputs.build-madara }}
    uses: ./.github/workflows/task-build-manual-and-publish.yml
    with:
      image-name: madara
      image-file: ./madara/Dockerfile
      skip-cargo-check: ${{ inputs.skip-cargo-check }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    secrets: inherit

  build-and-publish-orchestrator:
    if: ${{ inputs.build-orchestrator }}
    uses: ./.github/workflows/task-build-manual-and-publish.yml
    with:
      image-name: orchestrator
      image-file: ./orchestrator/Dockerfile
      skip-cargo-check: ${{ inputs.skip-cargo-check }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    secrets: inherit

  build-and-publish-bootstrapper:
    if: ${{ inputs.build-bootstrapper }}
    uses: ./.github/workflows/task-build-manual-and-publish.yml
    with:
      image-name: bootstrapper
      image-file: ./bootstrapper/Dockerfile
      skip-cargo-check: ${{ inputs.skip-cargo-check }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    secrets: inherit

  build-and-publish-bootstrapper-v2:
    if: ${{ inputs.build-bootstrapper-v2 }}
    uses: ./.github/workflows/task-build-manual-and-publish.yml
    with:
      image-name: bootstrapper-v2
      image-file: ./bootstrapper-v2/Dockerfile
      skip-cargo-check: ${{ inputs.skip-cargo-check }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    secrets: inherit
