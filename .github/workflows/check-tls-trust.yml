name: Check TLS trust
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Remove compromised roots before downloading tools
        run: sudo python3 security/distrust-emsign.py --debian
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Check workspace dependency coverage
        run: python3 security/check-lock.py
      - name: Check all Rust verifier generations and root stores
        run: cargo test --locked --manifest-path security/tls-regression/Cargo.toml
