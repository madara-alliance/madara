---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: Workflow - Dependabot Slack alert

# pull_request_target is used so the job can read the Slack secret for Dependabot PRs.
# This workflow never checks out or runs code from the pull request.
on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  notify:
    name: Notify - Dependabot PR
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          jq -n --arg text "Dependabot PR: ${PR_TITLE} - ${PR_URL}" '{text: $text}' \
            | curl --silent --show-error --fail-with-body -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
