name: Committed Data validation

on:
  pull_request:
  push:
    branches: [codex/committed-data-reads-cloud-ready]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: committed-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust
        with:
          rust-version: "1.89"
          extra-cache: "false"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: committed-data-validation-linux-1.89
          cache-workspace-crates: "true"
          cache-on-failure: "true"
      - uses: ./.github/actions/setup-cairo-native
      - uses: ./.github/actions/setup-python-cairo
        with:
          python-version: "3.10"
      - name: Fetch published contract artifacts
        run: |
          artifact_version=$(awk '$1 == "current_version:" { print $2 }' .artifact-versions.yml)
          [[ "$artifact_version" =~ ^[0-9]+$ ]]
          artifact_image="ghcr.io/madara-alliance/artifacts:$artifact_version"
          docker pull "$artifact_image"
          artifact_container=$(docker create "$artifact_image" do-nothing)
          trap 'docker rm -f "$artifact_container"' EXIT
          docker cp "$artifact_container:/artifacts.tar.gz" artifacts.tar.gz
          tar -xzf artifacts.tar.gz
          echo "RUST_BUILD_DOCKER=true" >> "$GITHUB_ENV"
      - name: Validate node and production orchestrator
        run: cargo +1.89 check --locked -p madara -p orchestrator
      - name: Verify persistence, quota, corruption and cache behavior
        if: ${{ !cancelled() }}
        run: cargo +1.89 test --locked -p mc-db committed_data -- --nocapture
      - name: Verify RPC decoding and local aggregator
        if: ${{ !cancelled() }}
        run: cargo +1.89 test --locked -p mc-rpc -p mc-submit-tx committed_data -- --nocapture
      - name: Verify aggregator and chain configuration
        if: ${{ !cancelled() }}
        run: cargo +1.89 test --locked -p orchestrator-aggregator-runner -p mp-chain-config --lib
      - name: Verify proving failure and retry classification
        if: ${{ !cancelled() }}
        run: cargo +1.89 test --locked -p orchestrator --lib error::job::snos::tests -- --nocapture
      - name: Verify committed-data CLI permission combinations
        if: ${{ !cancelled() }}
        run: cargo +1.89 test --locked -p orchestrator --lib cli::snos::tests -- --nocapture
      - name: Verify node configuration overrides
        if: ${{ !cancelled() }}
        run: cargo +1.89 test --locked -p madara --bin madara committed_data_settings -- --nocapture
