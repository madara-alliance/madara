---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: Task - Integration Tests (Madara)

# This workflow runs Madara integration tests from a prebuilt nextest archive
on:
  workflow_dispatch:
    inputs:
      measure-run-id:
        description: "Successful CI run at this exact commit containing the Madara test archive"
        required: true
        type: string
      entries:
        description: "Dataset entries (maximum 524288)"
        default: "16384"
        type: string
      updates:
        description: "Changed values per version"
        default: "1024"
        type: string
      versions:
        description: "Updates after the initial version"
        default: "70"
        type: string
      retained:
        description: "Proof versions to retain after simulated settlement"
        default: "8"
        type: string
      integer-values:
        description: "Use synthetic bounded-width integer values"
        default: false
        type: boolean
      large-moves:
        description: "Independently redraw every integer each tick instead of bounded increments"
        default: false
        type: boolean
      signed-rpc:
        description: "Also measure signed JSON RPC imports with pruning"
        default: false
        type: boolean
      rolling-versions:
        description: "Additional updates with pruning active every tick"
        default: "16"
        type: string
  workflow_call:
    inputs:
      proptest-cases:
        description: "Number of test cases for property testing"
        required: false
        type: string
        default: "10"
      madara-binary-hash:
        description: "Hash used to retrieve the artifact"
        required: true
        type: string
      madara-tests-hash:
        description: "Hash used to retrieve the archived test binaries"
        required: true
        type: string
    secrets:
      ETH_FORK_URL:
        required: true
      GITHUB_GATEWAY_KEY:
        required: false

jobs:
  test-madara:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      pull-requests: write
    runs-on: blacksmith-8vcpu-ubuntu-2204
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Load env
        uses: ./.github/actions/load-env

      - name: Foundry setup
        uses: ./.github/actions/setup-foundry
        with:
          foundry-version: ${{ env.BUILD_FOUNDRY_VERSION }}

      - name: Rust setup
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.BUILD_RUST_VERSION }}
          extra-cache: false

      - name: Go setup
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Download Madara binary
        uses: actions/download-artifact@v7
        with:
          name: madara-binary-${{ inputs.madara-binary-hash }}
          path: target/release/
      - run: chmod +x target/release/madara

      - name: Download Madara test archive
        uses: actions/download-artifact@v7
        with:
          name: madara-tests-${{ inputs.madara-tests-hash }}
          path: target/nextest/

      - name: Start Anvil with fork
        run: |
          nohup anvil \
            --fork-url ${{ secrets.ETH_FORK_URL }} \
            --fork-block-number ${{ env.ANVIL_FORK_BLOCK_NUMBER }} \
            --timeout 300000 \
            --port ${{ env.ANVIL_DEFAULT_PORT }} \
            --fork-retry-backoff 30000 &

          # Store the PID for later cleanup
          echo "ANVIL_PID=$!" >> $GITHUB_ENV

          # Wait for Anvil to start
          echo "Waiting for Anvil to start..."
          timeout 120s bash -c 'until curl -s -X POST --data "{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}" -H "Content-Type: application/json" ${{ env.ANVIL_DEFAULT_URL }} &>/dev/null; do sleep 2; echo "Retrying..."; done'

          if [ $? -eq 0 ]; then
            echo "Anvil is running in url: ${{ env.ANVIL_DEFAULT_URL }}"
          else
            echo "Failed to connect to Anvil within timeout"
            exit 1
          fi

      - name: Run tests
        id: runtime_tests
        env:
          ETH_FORK_URL: ${{ secrets.ETH_FORK_URL }}
          GATEWAY_KEY: ${{ secrets.GITHUB_GATEWAY_KEY || '' }}
          PROPTEST_CASES: ${{ inputs.proptest-cases }}
          ANVIL_URL: ${{ env.ANVIL_DEFAULT_URL }}
        run: |
          export COVERAGE_BIN="$(realpath target/release/madara)"
          cargo nextest run \
            --archive-file target/nextest/madara-tests.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" \
            -E 'not(package(madara)) | test(committed_data) | test(committed_listener) | test(service::rpc::) | test(submit_tx::)' \
            --no-fail-fast

      - name: Test committed-data Mongo recovery
        # Keep recovery coverage even when an unrelated runtime case fails.
        if: ${{ !cancelled() && steps.runtime_tests.outcome != 'skipped' }}
        env:
          RECOVERY_TEST_MONGO_URI: mongodb://localhost:27017
        run: |
          cargo nextest run \
            --archive-file target/nextest/madara-tests.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --run-ignored only \
            -E 'package(mc-external-db) & (test(mongo_recovery_restores_bases_and_rejects_corruption) | test(mongo_duplicate_retry_requires_matching_recovery_data) | test(mongo_historical_recovery_) | test(mongo_transaction_recovery_))' \
            --no-fail-fast

      - name: Test committed-data disk-full recovery
        if: ${{ !cancelled() && steps.runtime_tests.outcome != 'skipped' }}
        run: |
          fault_disk="$(mktemp -d "$RUNNER_TEMP/committed-data-enospc.XXXXXX")"
          trap 'sudo umount "$fault_disk"; rmdir "$fault_disk"' EXIT
          sudo mount -t tmpfs -o size=64M,mode=1777 tmpfs "$fault_disk"
          export MADARA_COMMITTED_DATA_FAULT_DISK="$fault_disk"
          cargo nextest run \
            --archive-file target/nextest/madara-tests.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --run-ignored only \
            --test-threads 1 \
            -E 'package(mc-db) & test(disk_full_during_reconstruction_preserves_archive_and_recovers_after_restart)'

      - name: Kill Anvil
        if: always()
        run: |
          if [ -n "$ANVIL_PID" ]; then
            echo "Stopping Anvil with PID: $ANVIL_PID"
            kill $ANVIL_PID || true
            echo "Anvil stopped"
          else
            echo "No Anvil PID found"
          fi

  measure-committed-data:
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-8vcpu-ubuntu-2204
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Load env
        uses: ./.github/actions/load-env
      - name: Rust setup
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.BUILD_RUST_VERSION }}
          extra-cache: false
      - uses: taiki-e/install-action@nextest
      - name: Verify archive revision
        env:
          GH_TOKEN: ${{ github.token }}
          MEASURE_RUN_ID: ${{ inputs.measure-run-id }}
        run: |
          test "$(gh run view "$MEASURE_RUN_ID" --json headSha --jq .headSha)" = "$GITHUB_SHA"
      - uses: actions/download-artifact@v7
        with:
          pattern: madara-tests-*
          merge-multiple: true
          path: target/nextest/
          run-id: ${{ inputs.measure-run-id }}
          github-token: ${{ github.token }}
      - name: Measure storage and cold proofs
        env:
          CD_MEASURE_ENTRIES: ${{ inputs.entries }}
          CD_MEASURE_UPDATES: ${{ inputs.updates }}
          CD_MEASURE_VERSIONS: ${{ inputs.versions }}
          CD_MEASURE_RETAINED: ${{ inputs.retained }}
          CD_MEASURE_INTEGER_VALUES: ${{ inputs.integer-values }}
          CD_MEASURE_LARGE_MOVES: ${{ inputs.large-moves }}
          CD_MEASURE_ROLLING_VERSIONS: ${{ inputs.rolling-versions }}
          CD_MEASURE_REPORT: ${{ github.workspace }}/retention-measurement.json
        run: |
          cargo nextest run --archive-file target/nextest/madara-tests.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" --run-ignored only --test-threads 1 \
            -E 'test(committed_history_measure_storage_and_memory)' --success-output immediate
      - name: Measure signed private RPC imports
        if: inputs.signed-rpc
        env:
          CD_MEASURE_ENTRIES: ${{ inputs.entries }}
          CD_MEASURE_VERSIONS: ${{ inputs.versions }}
          CD_MEASURE_RETAINED: ${{ inputs.retained }}
          CD_MEASURE_RPC_REPORT: ${{ github.workspace }}/rpc-measurement.json
          CD_MEASURE_LARGE_MOVES: ${{ inputs.large-moves }}
        run: |
          cargo nextest run --archive-file target/nextest/madara-tests.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" --run-ignored only --test-threads 1 \
            -E 'test(committed_data_measure_signed_rpc_imports)' --success-output immediate
      - uses: actions/upload-artifact@v6
        with:
          name: committed-data-retention-measurement
          path: |
            retention-measurement.json
            rpc-measurement.json
          if-no-files-found: error
