---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: Task - Integration Tests (Madara)

# This workflow runs Madara integration tests from a prebuilt nextest archive
on:
  workflow_dispatch:
    inputs:
      should_run:
        description: "Whether to run Madara tests or emit a required-check stub"
        required: false
        type: string
        default: "true"
      proptest-cases:
        description: "Number of test cases for property testing"
        required: false
        type: string
        default: "10"
      madara-binary-hash:
        description: "Hash used to retrieve the artifact"
        required: false
        type: string
        default: ""
      madara-tests-hash:
        description: "Hash used to retrieve the archived test binaries"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      should_run:
        description: "Whether to run Madara tests or emit a required-check stub"
        required: false
        type: string
        default: "true"
      proptest-cases:
        description: "Number of test cases for property testing"
        required: false
        type: string
        default: "10"
      madara-binary-hash:
        description: "Hash used to retrieve the artifact"
        required: false
        type: string
        default: ""
      madara-tests-hash:
        description: "Hash used to retrieve the archived test binaries"
        required: false
        type: string
        default: ""
    secrets:
      ETH_FORK_URL:
        required: false
      GITHUB_GATEWAY_KEY:
        required: false

jobs:
  test-madara:
    permissions:
      pull-requests: write
    runs-on: blacksmith-8vcpu-ubuntu-2204
    steps:
      - name: Skip Madara tests
        if: inputs.should_run != 'true'
        run: echo "No Madara runtime or migration changes detected; required check stubbed."

      - name: Checkout Repository
        if: inputs.should_run == 'true'
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Load env
        if: inputs.should_run == 'true'
        uses: ./.github/actions/load-env

      - name: Foundry setup
        if: inputs.should_run == 'true'
        uses: ./.github/actions/setup-foundry
        with:
          foundry-version: ${{ env.BUILD_FOUNDRY_VERSION }}

      - name: Rust setup
        if: inputs.should_run == 'true'
        uses: ./.github/actions/setup-rust
        with:
          rust-version: ${{ env.BUILD_RUST_VERSION }}
          extra-cache: false

      - name: Install nextest
        if: inputs.should_run == 'true'
        uses: taiki-e/install-action@nextest

      - name: Download Madara binary
        if: inputs.should_run == 'true'
        uses: actions/download-artifact@v7
        with:
          name: madara-binary-${{ inputs.madara-binary-hash }}
          path: target/release/

      - name: Make Madara binary executable
        if: inputs.should_run == 'true'
        run: chmod +x target/release/madara

      - name: Download Madara test archive
        if: inputs.should_run == 'true'
        uses: actions/download-artifact@v7
        with:
          name: madara-tests-${{ inputs.madara-tests-hash }}
          path: target/nextest/

      - name: Start Anvil with fork
        if: inputs.should_run == 'true'
        run: |
          nohup anvil \
            --fork-url ${{ secrets.ETH_FORK_URL }} \
            --fork-block-number ${{ env.ANVIL_FORK_BLOCK_NUMBER }} \
            --timeout 300000 \
            --port ${{ env.ANVIL_DEFAULT_PORT }} \
            --fork-retry-backoff 30000 &

          # Store the PID for later cleanup
          echo "ANVIL_PID=$!" >> $GITHUB_ENV

          # Wait for Anvil to start
          echo "Waiting for Anvil to start..."
          timeout 120s bash -c 'until curl -s -X POST --data "{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}" -H "Content-Type: application/json" ${{ env.ANVIL_DEFAULT_URL }} &>/dev/null; do sleep 2; echo "Retrying..."; done'

          if [ $? -eq 0 ]; then
            echo "Anvil is running in url: ${{ env.ANVIL_DEFAULT_URL }}"
          else
            echo "Failed to connect to Anvil within timeout"
            exit 1
          fi

      - name: Run tests
        if: inputs.should_run == 'true'
        env:
          ETH_FORK_URL: ${{ secrets.ETH_FORK_URL }}
          GATEWAY_KEY: ${{ secrets.GITHUB_GATEWAY_KEY || '' }}
          PROPTEST_CASES: ${{ inputs.proptest-cases }}
          ANVIL_URL: ${{ env.ANVIL_DEFAULT_URL }}
        run: |
          export COVERAGE_BIN="$(realpath target/release/madara)"
          cargo nextest run \
            --archive-file target/nextest/madara-tests.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --no-fail-fast

      - name: Kill Anvil
        if: always() && inputs.should_run == 'true'
        run: |
          if [ -n "$ANVIL_PID" ]; then
            echo "Stopping Anvil with PID: $ANVIL_PID"
            kill $ANVIL_PID || true
            echo "Anvil stopped"
          else
            echo "No Anvil PID found"
          fi
